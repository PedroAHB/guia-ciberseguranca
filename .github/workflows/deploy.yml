name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Padrão restritivo: somente leitura. Cada job eleva apenas o que precisa.
permissions:
  contents: read

# Um deploy por vez: evita que pushes simultâneos na branch gh-pages se rejeitem
# e que um run antigo termine depois de um novo e publique uma versão desatualizada.
# Runs novos aguardam o atual; entre os pendentes, só o mais recente é mantido.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mkdocs gh-deploy faz push na branch gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Instalar bibliotecas de sistema (cairo para os cards sociais)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Build e deploy do site
        run: mkdocs gh-deploy --force
