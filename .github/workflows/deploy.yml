name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Padrão restritivo: somente leitura. Cada job eleva apenas o que precisa.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mkdocs gh-deploy faz push na branch gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Build e deploy do site
        run: mkdocs gh-deploy --force
