name: 🐛 Problema no site
description: Erro de layout, navegação, busca, tema ou build do site.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Se o problema for uma vulnerabilidade de segurança no site (ex.: XSS), não use este formulário**: siga o `SECURITY.md`.

  - type: input
    id: url
    attributes:
      label: URL afetada
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição e passos para reproduzir
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Navegador e sistema operacional
      placeholder: Firefox 133 / Windows 11

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Procurei issues existentes e não encontrei uma duplicata.
          required: true
        - label: Este relato **não** descreve uma vulnerabilidade de segurança.
          required: true
