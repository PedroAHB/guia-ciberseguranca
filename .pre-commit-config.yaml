# Hooks executados antes de cada commit.
# Instalação: pip install pre-commit && pre-commit install
#
# As revisões são fixadas pelo SHA completo do commit, com a tag no comentário
# "frozen". Para atualizar: pre-commit autoupdate --freeze
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
